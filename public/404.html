<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — India Spice</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('is-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --text:#14140F; --text-soft:#5B5B54;
    --line:#E7E7E0; --green:#2F7A1E; --green-dark:#1E5713; --green-tint:#EEF6EA;
    --border-strong:#14140F;
  }
  html[data-theme="dark"]{
    --bg:#121210; --surface:#1B1B17; --text:#F3F3EE; --text-soft:#B4B4A9;
    --line:#2E2E28; --green:#4CAF3A; --green-dark:#6BC85B; --green-tint:#1E2B18;
    --border-strong:#F3F3EE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Poppins', sans-serif; color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column;
    transition:background-color .2s ease, color .2s ease;
  }
  h1,h2, .display{font-family:'Baloo 2', sans-serif; font-weight:700; line-height:1.03; letter-spacing:-0.01em;}
  a{text-decoration:none; color:inherit;}

  header{display:flex; align-items:center; justify-content:space-between; padding:20px 48px; border-bottom:1px solid var(--line);}
  .logo{display:flex; align-items:center; gap:12px;}
  .logo .badge{
    width:44px; height:44px; border-radius:50%; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px; border:3px solid var(--border-strong);
  }
  .logo .wordmark .top{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.02em;}
  .theme-toggle{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--surface);
    cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, transform .2s ease;
  }
  .theme-toggle:hover{border-color:var(--green); transform:translateY(-1px);}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;}
  .glow{position:absolute; width:480px; height:480px; border-radius:50%; background:var(--green-tint); top:50%; left:50%; transform:translate(-50%,-50%); z-index:0;}
  .content{position:relative; z-index:1; max-width:560px; text-align:center;}
  .eyebrow{display:inline-block; font-size:12px; font-weight:700; letter-spacing:0.22em; color:var(--green); margin-bottom:18px;}
  .jar{
    width:120px; height:120px; margin:0 auto 28px; border-radius:50%;
    background:var(--green-tint); border:3px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-size:44px; font-weight:800; color:var(--green);
  }
  h1{font-size:52px; margin-bottom:16px;}
  h1 .accent{color:var(--green);}
  .sub{font-size:16px; color:var(--text-soft); line-height:1.7; margin-bottom:40px; max-width:440px; margin-left:auto; margin-right:auto;}
  .actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn-green{
    background:var(--green); color:#fff; border:none; border-radius:999px; padding:16px 30px;
    font-weight:700; font-size:13px; letter-spacing:0.05em; cursor:pointer; transition:background .2s ease;
  }
  .btn-green:hover{background:var(--green-dark);}
  .btn-outline{
    border:2px solid var(--border-strong); border-radius:999px; padding:14px 28px;
    font-weight:700; font-size:13px; letter-spacing:0.05em; background:var(--surface); color:var(--text);
    cursor:pointer; transition:all .2s ease;
  }
  .btn-outline:hover{background:var(--text); color:var(--bg);}
  .spice-icons{display:flex; justify-content:center; gap:14px; margin-top:52px; flex-wrap:wrap;}
  .spice-icons span{width:52px; height:52px; border-radius:14px; background:var(--green-tint); display:flex; align-items:center; justify-content:center; font-size:22px;}
  footer{text-align:center; padding:24px; font-size:12px; color:var(--text-soft); border-top:1px solid var(--line);}

  @media (max-width:600px){
    header{padding:18px 20px;} h1{font-size:34px;}
    .actions{flex-direction:column; align-items:center;}
    .btn-green, .btn-outline{width:220px;}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <div class="badge">IS</div>
    <div class="wordmark"><div class="top">INDIA SPICE</div></div>
  </a>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</header>

<main>
  <div class="glow"></div>
  <div class="content">
    <span class="eyebrow">LOST IN THE PANTRY</span>
    <div class="jar">404</div>
    <h1>This jar is<br><span class="accent">empty.</span></h1>
    <p class="sub">The page you're looking for has been misplaced somewhere between the spice rack and the storeroom. Let's get you back to something fragrant.</p>
    <div class="actions">
      <a href="/"><button class="btn-green">BACK TO HOME</button></a>
    </div>
    <div class="spice-icons"><span>🌿</span><span>🌶️</span><span>🥜</span><span>🌾</span><span>🥒</span></div>
  </div>
</main>

<footer>© 2026 India Spice Heritage Pantry. All rights reserved.</footer>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  function updateToggleIcon(){
    const theme = document.documentElement.getAttribute('data-theme');
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  updateToggleIcon();
  themeToggle.addEventListener('click', function(){
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('is-theme', next); }catch(e){}
    updateToggleIcon();
  });
</script>

</body>
</html>
